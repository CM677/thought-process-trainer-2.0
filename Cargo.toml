[package]
name = "thought-process-trainer-2-0"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "thought-process-trainer"
path = "src/main.rs"

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", default-features = false, features = ["rayon"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

